# t004_carry.yaml — SZKIC PREREJESTRACJI T004 (H04, carry)
#
# STATUS: DRAFT — NIE ZAMROŻONY. Żadna sekcja nie ma `frozen: true`.
# Runner T004 nie istnieje; zamrożenie wymaga decyzji oznaczonych
# `DECYZJA:` poniżej. Do tego czasu cecha H04 NIE może zostać zestawiona
# z żadnym zwrotem (ADR-012, ADR-020).
#
# Podstawa: ADR-017 (deflacja przed zamrożeniem) · ADR-019 (kontrola
# zachowująca autokorelację) · ADR-022 (geometria przed planem) · ADR-023
# (seria overnight, point-in-time) · M09, M10.

meta:
  trial_id: "T004"
  hypothesis: "H04"
  type: "confirmatory"
  inherits: "configs/base.yaml"
  frozen: false
  n_variants: 1                    # jedna komórka
  counter_before: 10
  counter_after: 11

hypothesis:
  mechanism: >
    Naruszenie parytetu stóp procentowych (UIP). Waluta wyżej oprocentowana
    nie deprecjonuje się tyle, ile implikuje różnica stóp.
  prediction: >
    Różnica stóp overnight (base − quote), znana w momencie decyzji, ma
    DODATNIĄ relację ze znormalizowanym zwrotem ceny pary przez kolejne h.
  measured_on: "wszystkie decyzje sesji primary z określoną cechą i targetem"

sample:
  universe: [EURUSD, GBPUSD, USDJPY, AUDUSD, USDCAD, EURJPY]
  warmup_from: "2015-01-01"
  first_decision: "2016-01-01"
  last_decision_segment_end: "2021-12-31"
  session: {primary: {start: "08:00", end: "22:00", tz: "UTC"}}
  windows_crossing_segment_end: {policy: "drop"}

feature:
  name: "carry_policy"
  formula: "stopa_polityki(base) − stopa_polityki(quote), punkty procentowe"
  definition: "stopa polityki sterująca rynkiem overnight (ADR-025)"
  sources:
    USD: "FRED DFEDTARU/DFEDTARL — środek przedziału"
    EUR: "FRED ECBDFR — stopa depozytowa"
    GBP: "BoE IADB IUDBEDR — Bank Rate"
    CAD: "BoC Valet V39079"
    AUD: "tabela ręczna RBA (src/data/policy_rates.py), zweryfikowana w M12"
    JPY: "tabela ręczna BoJ, zweryfikowana w M12"
  verification: "M12 — każda waluta wobec OECD overnight, 0 podejrzanych miesięcy"
  availability: >
    Wartość z dnia ≤ decyzja − 1 dzień roboczy (`policy_pit`). Stopa
    polityki nie jest rewidowana i nie ma opóźnienia publikacji.
  missing: "brak wartości -> wiersz odpada, liczony w raporcie (M12: 0 dni)"
  replaces: "OECD overnight z ALFRED — EUR bez PIT w 2016–2017 (ADR-025)"

grid:
  horizons_business_days: [3]
  cells: 1
  # DECYZJA: napięcie horyzontu (HYPOTHESES.md H04). Mechanizm działa
  # w skali miesięcy; h = 3 d to jedyny horyzont z kalibracją kosztu
  # (M03, M04) i zmierzoną mocą (M09, M10). Rekomendacja: h = 3 d, z zapisem,
  # że wynik dotyczy trzydniowego wycinka dryfu UIP — NIE zdolności
  # przewidywania na skali miesięcy. Dłuższy horyzont wymaga osobnej
  # kalibracji kosztu i mocy (M05: h = 10 d traci FALSIFIED).

layer_a:
  target: "fwd_atr = (cena wyjścia − cena odniesienia) / atr_d1_14"
  primary_statistic: "spearman(carry_policy, fwd_atr), rangi średnie, pooled po parach"
  statistic_choice_rationale: >
    Jak w T003 (kurtoza fwd_atr). Rangi ŚREDNIE, bo cecha miesięczna ma
    masowe remisy — rangi z argsort rozstrzygałyby je kolejnością wierszy.
  ci:
    method: "rozklad_zerowy_surogatu"   # ADR-026 — reguła M10 wskazała null, nie bootstrap
    formula: "rho_hat ± 1,96 · SE_null"
    se_null: "400 replikacji surogatu skalibrowanego jak M09B (M12 → M09B policy)"
    level: 0.95
    reported_alongside: "block bootstrap po dniach, 20 dni — bez wpływu na werdykt"
    consistency_check:
      rule: >
        SE_null ORAZ SE_boot na danych prawdziwych w [0,5; 2,0] × prawdziwe SD
        ze świata syntetycznego M10 (0,02472–0,02542).
      on_failure: "STOP — przyrząd nie mierzy tego, co zmierzył M10"
      m10_run: "20260924T213436Z-7a92ef"
  power:
    source: "M10 na stopach polityki — prawdziwe SD, najgorszy wariant (AR(1) / gauss)"
    n_eff: 1547
    half_ci_over_rho_be: 0.92
    mde_acc_pct_before_deflation: 52.27
    dead_zone_pp_before_deflation: 0.55
    runtime_risk: >
      SE_null ma cv ≈ 0,33. P(SE_null > 0,02756) ≈ 41% — wtedy FALSIFIED jest
      nieosiągalne w samym przebiegu i wynik może być wyłącznie SUPPORTED
      albo NOT_SUPPORTED z górnym ograniczeniem (ADR-026).

falsification:
  layer: "A"
  breakeven: {accuracy_pct: 51.72, rho_equivalent: 0.05401}
  supported:
    rule: "CI > 0 PO DEFLACJI oraz kontrola zachowująca autokorelację pobita"
    # DECYZJA (ADR-017): forma deflacji o N. Rekomendacja w raporcie sesji.
    deflation: "PENDING_DECISION"
  falsified:
    rule: "CI95 w całości wewnątrz ±0,05401"
    multiplicity: "brak — jedna komórka; deflacja nie dotyczy równoważności"
  not_supported:
    rule: "każdy inny wynik"
    reporting_duty: "górne ograniczenie w jednostce trafności kierunku"

random_control:
  # ADR-019: kontrola musi zachowywać autokorelację cechy.
  method: >
    Surogat carry skalibrowany jak w M09B (geometria z M12), cecha
    losowana, zwroty prawdziwe. NIE permutacja wierszy.
  identity_with_ci: >
    Ten sam surogat daje CI (ADR-026), więc „kontrola pobita" jest tożsama
    z CI > 0 i nie jest liczona podwójnie.

control_aged_feature:
  arm: "carry_policy z marginesem 6 dni roboczych zamiast 1 (wartość o tydzień starsza)"
  criterion: "rho_aged − rho_true < 2·SE(różnicy)"

layer_b:
  role: "wycena — raportowana, nie rozstrzyga"
  run_when: "tylko przy sygnale w A (ADR-003)"
  note: >
    Dla carry człon finansowania jest KIERUNKOWY — różnica stóp jest tu
    przychodem, nie tylko kosztem. `swap.py` liczy wyłącznie marżę
    (ADR-016); wycena carry wymaga dołożenia członu różnicy stóp PIT
    do wyniku. To jest praca PRZED zamrożeniem warstwy B.
